name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      crate_name: ${{ steps.release.outputs.crate_name }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Validate tag and package metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          version="${tag#v}"
          crate_name="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^name = / { gsub(/^name = "|"$/, ""); print; exit }
          ' Cargo.toml)"
          manifest_version="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version = / { gsub(/^version = "|"$/, ""); print; exit }
          ' Cargo.toml)"
          lock_version="$(awk -v crate="${crate_name}" '
            /^\[\[package\]\]$/ { in_package = 0 }
            $0 == "name = \"" crate "\"" { in_package = 1 }
            in_package && /^version = / { gsub(/^version = "|"$/, ""); print; exit }
          ' Cargo.lock)"

          if [[ -z "${crate_name}" || -z "${manifest_version}" || -z "${lock_version}" ]]; then
            echo "Could not read package metadata" >&2
            exit 1
          fi
          if [[ "${version}" != "${manifest_version}" || "${version}" != "${lock_version}" ]]; then
            echo "${tag} must match the versions in Cargo.toml and Cargo.lock" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "The tagged commit is not part of main" >&2
            exit 1
          fi

          {
            echo "commit=${GITHUB_SHA}"
            echo "crate_name=${crate_name}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run release checks
        run: |
          cargo test --locked --all-targets
          cargo package --locked

      - name: Extract release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="${VERSION}" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          sed -i '/./,$!d' RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Upload release notes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  build-linux:
    name: Build portable Linux release asset
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and package portable Linux archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          bundle="camilo-${VERSION}-${host_target}"
          stage_root="${RUNNER_TEMP}/camilo-release-stage"
          archive="${RUNNER_TEMP}/${bundle}.tar.gz"
          source_date_epoch="$(git log -1 --format=%ct)"

          cargo build --locked --release

          rm -rf "${stage_root}"
          mkdir -p "${stage_root}/${bundle}/share"
          install -Dm755 target/release/camilo "${stage_root}/${bundle}/camilo"
          install -Dm644 README.md CHANGELOG.md LICENSE -t "${stage_root}/${bundle}"
          install -Dm644 packaging/linux/camilo.desktop \
            "${stage_root}/${bundle}/share/camilo.desktop"
          cp -R packaging/linux/icons "${stage_root}/${bundle}/share/icons"

          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "${stage_root}" \
            -cf - "${bundle}" \
            | gzip -n > "${archive}"

          for entry in \
            "${bundle}/camilo" \
            "${bundle}/README.md" \
            "${bundle}/CHANGELOG.md" \
            "${bundle}/LICENSE" \
            "${bundle}/share/camilo.desktop" \
            "${bundle}/share/icons/hicolor/512x512/apps/camilo.png"; do
            tar -tzf "${archive}" "${entry}" >/dev/null
          done

          mkdir -p dist
          mv "${archive}" "dist/${bundle}.tar.gz"
          sha256sum "dist/${bundle}.tar.gz"

      - name: Upload portable Linux release asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-asset-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs:
      - validate
      - build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-notes
          path: release-notes

      - name: Download portable Linux release asset
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-asset-linux
          path: dist

      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes/RELEASE_NOTES.md
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes/RELEASE_NOTES.md
          fi

  publish-crates:
    name: Publish crate to crates.io
    needs:
      - validate
      - github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check whether this version is already published
        id: crates
        env:
          CRATE_NAME: ${{ needs.validate.outputs.crate_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = f"https://crates.io/api/v1/crates/{os.environ['CRATE_NAME']}"
          try:
              with urllib.request.urlopen(url) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("published=false")
                  sys.exit(0)
              raise

          versions = {entry["num"] for entry in payload.get("versions", [])}
          print(f"published={'true' if os.environ['VERSION'] in versions else 'false'}")
          PY

      - name: Authenticate with crates.io
        id: auth
        if: steps.crates.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish to crates.io
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Report existing crate version
        if: steps.crates.outputs.published == 'true'
        run: echo "${{ needs.validate.outputs.crate_name }} ${{ needs.validate.outputs.version }} is already published on crates.io"

  update-aur:
    name: Publish AUR package (${{ matrix.package.name }})
    needs:
      - validate
      - publish-crates
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: camilo
            repo: ssh://aur@aur.archlinux.org/camilo.git
            dir: aur-camilo
          - name: camilo-bin
            repo: ssh://aur@aur.archlinux.org/camilo-bin.git
            dir: aur-camilo-bin

    steps:
      - name: Install packaging tools
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm --needed \
            git \
            openssh \
            pacman-contrib
          useradd -m builder

      - name: Configure AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          known_hosts="$(mktemp)"
          ssh-keyscan -H aur.archlinux.org > "${known_hosts}"
          if [[ ! -s "${known_hosts}" ]]; then
            echo "Failed to fetch AUR SSH host keys" >&2
            exit 1
          fi
          mv "${known_hosts}" ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          {
            echo "Host aur.archlinux.org"
            echo "    HostName aur.archlinux.org"
            echo "    User aur"
            echo "    IdentityFile ${HOME}/.ssh/aur"
            echo "    IdentitiesOnly yes"
            echo "    UserKnownHostsFile ${HOME}/.ssh/known_hosts"
            echo "    StrictHostKeyChecking yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Clone AUR package repository
        env:
          AUR_REPO: ${{ matrix.package.repo }}
          AUR_DIR: ${{ matrix.package.dir }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -F ${HOME}/.ssh/config"
          git clone "${AUR_REPO}" "${AUR_DIR}"
          chown -R builder:builder "${AUR_DIR}"

      - name: Update PKGBUILD and .SRCINFO
        env:
          AUR_DIR: ${{ matrix.package.dir }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          runuser -u builder -- env \
            AUR_DIR="${AUR_DIR}" \
            RELEASE_VERSION="${RELEASE_VERSION}" \
            bash <<'BASH'
            set -euo pipefail
            cd "${AUR_DIR}"

            current_pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n1)"
            current_pkgrel="$(sed -n 's/^pkgrel=//p' PKGBUILD | head -n1)"
            if [[ -z "${current_pkgver}" || -z "${current_pkgrel}" ]]; then
              echo "Failed to read pkgver/pkgrel from ${AUR_DIR}/PKGBUILD" >&2
              exit 1
            fi
            if [[ ! "${current_pkgrel}" =~ ^[0-9]+$ ]]; then
              echo "Unsupported non-numeric pkgrel '${current_pkgrel}' in ${AUR_DIR}/PKGBUILD" >&2
              exit 1
            fi

            same_version=false
            target_pkgrel=1
            if [[ "${current_pkgver}" == "${RELEASE_VERSION}" ]]; then
              same_version=true
              target_pkgrel="${current_pkgrel}"
            fi

            update_pkgbuild() {
              local pkgrel="$1"
              sed -i "s/^pkgver=.*/pkgver=${RELEASE_VERSION}/" PKGBUILD
              sed -i "s/^pkgrel=.*/pkgrel=${pkgrel}/" PKGBUILD
              sed -i "s/^sha256sums=.*/sha256sums=('SKIP')/" PKGBUILD

              for attempt in {1..12}; do
                if updpkgsums; then
                  break
                fi
                if [[ "${attempt}" -eq 12 ]]; then
                  echo "Failed to generate AUR checksum after 12 attempts" >&2
                  exit 1
                fi
                sleep 10
              done
              makepkg --printsrcinfo > .SRCINFO
            }

            update_pkgbuild "${target_pkgrel}"
            if [[ "${same_version}" == "true" ]] && ! git diff --quiet -- PKGBUILD .SRCINFO; then
              update_pkgbuild "$((current_pkgrel + 1))"
            fi
          BASH

      - name: Commit and push AUR update
        working-directory: ${{ matrix.package.dir }}
        env:
          AUR_PACKAGE: ${{ matrix.package.name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${PWD}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already up to date"
            exit 0
          fi
          git commit -m "Update ${AUR_PACKAGE} to ${RELEASE_VERSION}"
          export GIT_SSH_COMMAND="ssh -F ${HOME}/.ssh/config"
          git push
